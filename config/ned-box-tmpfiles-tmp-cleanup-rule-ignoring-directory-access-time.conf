# Installed on ned-box as /etc/tmpfiles.d/tmp.conf, which replaces the distribution's
# /usr/lib/tmpfiles.d/tmp.conf; install and preview it with
# scripts/ned-box-tmpfiles-tmp-cleanup-rule-dry-run-or-install-and-clean-once.py.
#
# ned-box's /tmp is a tmpfs mounted without relatime, so every listing of a directory
# there refreshes its access time, and agents list /tmp all day. The default age-by,
# abcmABM, counts that access time (A), so almost nothing in /tmp ever ages out.
# abcmBM drops only A: a directory ages by its birth and modification times, while a
# file's access time (a) still counts, so a file something still reads keeps itself,
# and with it its directory. See tmpfiles.d(5), "Age".
q /tmp 1777 root root abcmBM:10d
# Same as the distribution's line, which this file's name hides.
q /var/tmp 1777 root root 30d
