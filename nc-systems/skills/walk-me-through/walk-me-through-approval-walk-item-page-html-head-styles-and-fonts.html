<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* One reading column: a walk item, read top to bottom, decision at the foot. */
:root{--bg:#f6f7f9;--fg:#1c2230;--muted:#5b6475;--accent:#2f5d9e;--rule:#d5dae3;--code:#e9edf3;
--display:"IBM Plex Sans",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141820;--fg:#e2e6ee;--muted:#9aa3b5;--accent:#8db4ec;--rule:#2c3340;--code:#1f2530;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141820;--fg:#e2e6ee;--muted:#9aa3b5;--accent:#8db4ec;--rule:#2c3340;--code:#1f2530;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px}
main{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:1.5rem;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:1.1rem;margin:10px 0 0}
h3,h4,h5,h6{font-size:1rem;margin:8px 0 0}
p{margin:0;overflow-wrap:anywhere}
ul,ol{margin:0;padding-left:20px}
code{font-family:var(--mono);font-size:.86em;background:var(--code);padding:1px 4px;border-radius:3px}
pre{margin:0;padding:8px 12px;background:var(--code);border-radius:3px;overflow-x:auto}
pre code{padding:0;background:none}
table{border-collapse:collapse;display:block;overflow-x:auto}
th,td{border:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
blockquote{margin:0;padding:8px 14px;border-left:3px solid var(--accent);background:var(--code);border-radius:3px}
blockquote p{margin:6px 0}
a{color:var(--accent)}
.tag{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rec{border-top:1px solid var(--rule);padding-top:14px;font-weight:600}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&display=swap">
